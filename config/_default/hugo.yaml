# Hugo configuration — custom theme (no external theme modules).
# Docs: https://gohugo.io/configuration/

title: Raihanul Alam Hridoy
baseURL: 'https://hridoy100.github.io/'

defaultContentLanguage: en
removePathAccents: true

enableGitInfo: true
enableEmoji: true
enableRobotsTXT: true
summaryLength: 30

pagination:
  pagerSize: 12

outputs:
  home: [HTML, RSS]
  section: [HTML, RSS]
  taxonomy: [HTML]
  term: [HTML]

taxonomies:
  author: authors
  tag: tags
  publication_type: publication_types

imaging:
  resampleFilter: lanczos
  jpeg:
    quality: 82
  webp:
    quality: 82
  anchor: smart

markup:
  goldmark:
    renderer:
      unsafe: true
    parser:
      wrapStandAloneImageWithinParagraph: false
      attribute:
        block: true
  highlight:
    noClasses: false
    lineNos: false
  tableOfContents:
    startLevel: 2
    endLevel: 3

ignoreFiles: [\.ipynb$, .ipynb_checkpoints$, \.Rmd$, \.Rmarkdown$, _cache$]
timeout: 600s
