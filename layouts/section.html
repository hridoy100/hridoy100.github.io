{{ define "main" }}
<header class="page-head">
  <div class="wrap">
    <h1>{{ .Title }}</h1>
    {{- with .Params.summary }}<p class="lede">{{ . | markdownify }}</p>{{ end }}
  </div>
</header>
<div class="wrap">
  {{- $pages := .Paginate .Pages.ByDate.Reverse }}
  <ul class="post-list">
    {{- range $pages.Pages }}{{ partial "post-item.html" . }}{{ end }}
  </ul>
  {{- partial "pagination.html" . }}
</div>
{{ end }}
