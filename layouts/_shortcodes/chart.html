{{- /* Plotly chart from a JSON resource in the page bundle: {{< chart data="file-without-ext" >}} */ -}}
{{- $id := printf "chart-%d" .Ordinal -}}
{{- with .Page.Resources.Get (printf "%s.json" (.Get "data")) -}}
<div id="{{ $id }}" style="min-height:360px"></div>
<script src="https://cdn.jsdelivr.net/npm/plotly.js-dist-min@2.35.2/plotly.min.js"></script>
<script>(function(){var f={{ .Content | safeJS }};Plotly.newPlot({{ $id }},f.data||f,f.layout||{},{responsive:true});})();</script>
{{- end -}}
