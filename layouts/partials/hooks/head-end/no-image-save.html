<script>
// Deterrents against casually saving images (right-click, drag).
// Note: this cannot stop screenshots or a determined user with dev tools.
(function () {
  document.addEventListener('contextmenu', function (e) {
    if (e.target && e.target.tagName === 'IMG') {
      e.preventDefault();
    }
  }, false);
  document.addEventListener('dragstart', function (e) {
    if (e.target && e.target.tagName === 'IMG') {
      e.preventDefault();
    }
  }, false);
})();
</script>
